plugins {
    id 'java'
    id 'com.enonic.xp.app' version '3.1.0'
}

xp {
    version = xpVersion
}

app {
    name = 'EnonicRequestfilter'
    displayName = 'Enonic Requestfilter'
    vendorName = 'TINE SA'
    vendorUrl = 'https://www.tine.no'
    systemVersion = "${xpVersion}"
}

dependencies {
    compile "com.enonic.xp:core-api:${xpVersion}"
    compile "com.enonic.xp:portal-api:${xpVersion}"
    compile "com.enonic.xp:web-api:${xpVersion}"
    compile "com.enonic.xp:web-vhost:${xpVersion}"
    include "com.enonic.xp:lib-content:${xpVersion}"
    include "com.enonic.xp:lib-portal:${xpVersion}"
    compile "javax.servlet:javax.servlet-api:4.0.1"
    compile "org.springframework:spring-web:5.3.21"
    compile "org.json:json:20210307"
    testImplementation "org.junit.jupiter:junit-jupiter:5.7.2"
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo()
}

test {
    useJUnitPlatform()
}
